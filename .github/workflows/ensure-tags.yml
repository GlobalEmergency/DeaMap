name: Ensure Version Tags

on:
  push:
    branches: [main]

concurrency:
  group: ensure-tags
  cancel-in-progress: false

jobs:
  ensure-tags:
    name: Create missing version tags
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure mobile tag
        id: mobile-tag
        run: |
          if [ -f mobile/version.json ]; then
            VERSION=$(node -e "console.log(require('./mobile/version.json').version)")
            TAG="mobile@${VERSION}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "✅ Tag $TAG already exists — skipping"
            else
              echo "📦 Creating tag $TAG"
              git tag "$TAG"
              git push origin "$TAG"
              echo "✅ Tag $TAG created and pushed"
            fi
          else
            echo "⚠️ mobile/version.json not found — skipping mobile tag"
          fi

      # The release workflow creates the GitHub Release as it starts (create-release),
      # so a version without one has not been released yet: a failed dispatch
      # is retried by re-running this job, a released version is never repeated.
      # gh workflow run because a release created with GITHUB_TOKEN would not
      # trigger the release workflow; --ref pins the run to the tagged commit.
      - name: Trigger mobile release workflow
        if: steps.mobile-tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mobile-tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✅ Release $TAG already exists — nothing to publish"
            exit 0
          fi
          echo "🚀 Triggering release workflow for $TAG"
          gh workflow run release-mobile-app.yml --ref "$TAG" \
            -f deploy_android=true \
            -f deploy_ios=true \
            -f android_track=production

      - name: Ensure web tag
        if: ${{ !cancelled() }}
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="web@${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "✅ Tag $TAG already exists — skipping"
          else
            echo "📦 Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            echo "✅ Tag $TAG created and pushed"
          fi
